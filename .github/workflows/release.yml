name: Release UI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a tag such as v2.0.0 or v2.0.0-beta.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmms-ui-build
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pmms-ui-build
          path: artifacts
      - name: Publish compiled UI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum --check pmms-ui.zip.sha256)
          cat > release-notes.md <<'EOF'
          Download **pmms-ui.zip** below for the compiled UI. The automatic GitHub source archives are for development.

          Install the four files in the ZIP's `ui/` folder into an existing PMMS resource. Keep the original PMMS libraries and add `ui/locale.json` to `fxmanifest.lua`. See `INSTALL.md` in the ZIP for full instructions. English and French translations are included.
          EOF
          extra_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            extra_flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/pmms-ui.zip artifacts/pmms-ui.zip.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/pmms-ui.zip artifacts/pmms-ui.zip.sha256 \
              --verify-tag --draft --title "PMMS UI $RELEASE_TAG" \
              --notes-file release-notes.md --generate-notes "${extra_flags[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
